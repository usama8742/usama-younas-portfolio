<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0878FE"/>
      <stop offset="100%" stop-color="#0255FD"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#0878FE"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(6, 6)">
    <!-- Base Rounded Badge -->
    <rect width="52" height="52" rx="14" fill="url(#brandGrad)"/>
    <rect x="0.75" y="0.75" width="50.5" height="50.5" rx="13.25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Dynamic 3X Automation Symbol -->
    <!-- Stylized "3" -->
    <path d="M16 16.5H25.5C28.5376 16.5 31 18.9624 31 22C31 24.3168 29.5636 26.2982 27.5 27.08C30.0636 27.8618 31.5 29.9832 31.5 32.5C31.5 35.8137 28.8137 38.5 25.5 38.5H16" 
          stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 27.5H26.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Stylized "X" with Intersecting Automation Nodes -->
    <path d="M30 17.5L42 37.5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M42 17.5L30 37.5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Glowing Connected Automation Nodes (The 3X multipliers) -->
    <circle cx="42" cy="17.5" r="2.5" fill="#EAF3FF" filter="url(#softGlow)"/>
    <circle cx="30" cy="37.5" r="2.5" fill="#EAF3FF"/>
    <circle cx="36" cy="27.5" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Typography: 3X AI AUTOMATION -->
  <g transform="translate(70, 16)">
    <!-- Brand Name -->
    <text x="0" y="21" font-family="'Inter', 'Manrope', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.03em" fill="#111827">
      3X <tspan fill="#0878FE">AI</tspan>
    </text>
    <text x="76" y="21" font-family="'Inter', 'Manrope', -apple-system, sans-serif" font-weight="800" font-size="16" letter-spacing="0.08em" fill="#111827">
      AUTOMATION
    </text>

    <!-- Subtitle Tag -->
    <text x="1" y="36" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.14em" fill="#0878FE">
      INTELLIGENT SYSTEMS
    </text>
  </g>
</svg>
